<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Design Release Schedule</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="masthead-main">
          <div>
            <p class="eyebrow">Portal · Ground segment</p>
            <h1>Release schedule</h1>
            <p class="range-caption">Now through 31 December 2026</p>
          </div>
          <div class="now-card" id="now-card"></div>
        </div>
      </header>

      <div class="in-progress">
        <span class="toolbar-label">In progress</span>
        <div id="topbar-meta"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <span class="toolbar-label">Designers</span>
          <div class="designer-filter" id="designer-filter"></div>
          <button type="button" class="btn ghost" id="manage-team">Manage team</button>
        </div>
        <div class="toolbar-right">
          <button type="button" class="btn ghost" id="reset-schedule">Reset to original</button>
          <button type="button" class="btn primary" id="add-work">Add work</button>
        </div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <footer class="legend">
        <span><i class="swatch design"></i> Design</span>
        <span><i class="swatch engineering"></i> Engineering</span>
        <span><i class="swatch handed-off"></i> Handed off / research</span>
        <span><i class="swatch exploration"></i> Exploration</span>
        <span><i class="diamond"></i> Handoff to Dev</span>
        <span><i class="star"></i> Release</span>
        <span><i class="today-swatch"></i> Current week</span>
      </footer>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <form id="work-form">
        <div class="drawer-head">
          <h2 id="drawer-title">Work item</h2>
          <button type="button" class="icon-btn" id="close-drawer" aria-label="Close">×</button>
        </div>
        <label>
          Title
          <input name="title" required placeholder="Feature name" />
        </label>
        <div class="row-2">
          <label>
            Section
            <select name="section">
              <option value="immediate">Immediate Priorities</option>
              <option value="explorations">Explorations</option>
              <option value="q4">Q4 Efforts</option>
            </select>
          </label>
          <label>
            Designer
            <select name="assigneeId" id="assignee-select"></select>
          </label>
        </div>
        <label>
          Tickets
          <input name="tickets" placeholder="PR-1234 / Design-56" />
        </label>
        <label>
          Notes
          <textarea name="notes" rows="3" placeholder="Context, blockers, who to talk to"></textarea>
        </label>

        <div class="drawer-section-head">
          <h3>Timeline</h3>
          <button type="button" class="btn ghost small" id="add-bar">Add phase</button>
        </div>
        <div id="bars-editor"></div>

        <div class="drawer-section-head">
          <h3>Milestones</h3>
          <button type="button" class="btn ghost small" id="add-milestone">Add milestone</button>
        </div>
        <div id="milestones-editor"></div>

        <div class="drawer-actions">
          <button type="button" class="btn danger ghost" id="delete-work">Delete</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

    <dialog id="team-dialog">
      <form method="dialog" id="team-form">
        <div class="drawer-head">
          <h2>Designers</h2>
          <button type="submit" class="icon-btn" aria-label="Close">×</button>
        </div>
        <p class="hint">Initials show on the board. Names appear in the editor and filters.</p>
        <div id="team-list"></div>
        <button type="button" class="btn ghost" id="add-designer">Add designer</button>
        <div class="drawer-actions">
          <button type="submit" class="btn primary">Done</button>
        </div>
      </form>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
